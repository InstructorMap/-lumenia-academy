<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar diploma · YUNA Academy</title><style>body{margin:0;background:#f8f5ef;color:#253347;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:640px;margin:8vh auto;padding:24px}.card{background:white;border:1px solid #e0d4bf;border-radius:18px;padding:35px;box-shadow:0 20px 60px #26334712}h1{font:36px Georgia,serif}input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #b9aa91;border-radius:9px;font-size:17px}button{background:#253347;color:white;border:0;border-radius:8px;padding:14px 22px;margin-top:14px;cursor:pointer}#result{margin-top:22px;padding:18px;background:#f6f2e9;border-radius:10px}a{color:#88653a}</style></head><body><div class="wrap"><p><a href="../">← YUNA Academy</a></p><div class="card"><h1>Validación de diplomas</h1><p>Ingresá el código único impreso en el diploma o escaneá su QR. La verificación consulta el registro institucional de YUNA Academy.</p><form id="form"><label for="code">Código de verificación</label><input id="code" maxlength="128" required autocomplete="off" placeholder="Código del diploma"><button id="submit">Verificar autenticidad</button></form><div id="result" role="status" aria-live="polite">Todavía no se realizó ninguna consulta.</div><p><small>Un diploma de muestra no es una certificación válida.</small></p></div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.0";const db=createClient("https://ejfdwwolmwwrvaxvkdlw.supabase.co","sb_publishable_SngMHi2Yz6AxdiLVEvQkUA_iOkMwe3i");const code=document.getElementById("code"),result=document.getElementById("result"),btn=document.getElementById("submit");code.value=new URLSearchParams(location.search).get("code")||"";document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const value=code.value.trim();if(!value)return;btn.disabled=true;result.textContent="Consultando registro institucional…";try{const{data,error}=await db.rpc("yuna_verify_certificate",{p_code:value});if(error)throw error;result.replaceChildren();const title=document.createElement("strong");title.textContent=!data?.found?"No se encontró un diploma con ese código":data.test?"DIPLOMA DE PRUEBA · SIN VALIDEZ ACADÉMICA":data.valid?"Diploma registrado y vigente":"Diploma revocado · sin validez";result.append(title);if(data?.found){const p=document.createElement("p");p.textContent="Programa: "+data.course+" · Emisión: "+new Date(data.issued_at).toLocaleDateString("es-AR")+(data.test?" · Solo para pruebas de funcionamiento":"");result.append(p)}}catch(err){result.textContent="No se pudo verificar en este momento. Intentá nuevamente. "+err.message}finally{btn.disabled=false}});if(code.value)document.getElementById("form").requestSubmit();</script></body></html>
