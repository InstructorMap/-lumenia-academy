name: Build YUNA Academy APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare release signing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          YUNA_KEYSTORE_BASE64: ${{ secrets.YUNA_KEYSTORE_BASE64 }}
          YUNA_KEYSTORE_PASSWORD: ${{ secrets.YUNA_KEYSTORE_PASSWORD }}
          YUNA_KEY_ALIAS: ${{ secrets.YUNA_KEY_ALIAS }}
          YUNA_KEY_PASSWORD: ${{ secrets.YUNA_KEY_PASSWORD }}
        run: |
          test -n "$YUNA_KEYSTORE_BASE64" && test -n "$YUNA_KEYSTORE_PASSWORD" && test -n "$YUNA_KEY_ALIAS" && test -n "$YUNA_KEY_PASSWORD" || { echo "Release signing secrets missing"; exit 1; }
          printf '%s' "$YUNA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yuna-release.jks"
          echo "YUNA_KEYSTORE_PATH=$RUNNER_TEMP/yuna-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        env:
          YUNA_KEYSTORE_PASSWORD: ${{ secrets.YUNA_KEYSTORE_PASSWORD }}
          YUNA_KEY_ALIAS: ${{ secrets.YUNA_KEY_ALIAS }}
          YUNA_KEY_PASSWORD: ${{ secrets.YUNA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: YUNA-Academy-Release-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: YUNA-Academy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
